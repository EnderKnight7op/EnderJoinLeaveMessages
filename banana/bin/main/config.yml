# Configure the messages shown when players join or leave the server.

# Message formatting system.
# Options: legacy, minimessage
# Any value other than "minimessage" uses the legacy system.
format: legacy

# Legacy formatting:
# Use '&' for colour codes (for example, &a will make the text green).
#
# MiniMessage formatting:
# Use MiniMessage tags for colours, hex colours, gradients, and other formatting.
# Example: <gradient:#00E5FF:#FFFFFF><bold>Member</bold></gradient>
#
# Use %player% to get the player name
# You can use multiple lines

join-message: "&a[+] %player%"
leave-message: "&c[-] %player%"